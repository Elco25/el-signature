*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Montserrat,system-ui,sans-serif}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.btn{background:var(--bronze);color:#fff;border:0;padding:11px 18px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);padding:11px 12px;border-radius:0}
textarea{resize:vertical}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:380px;display:grid;gap:12px}

.err{color:var(--danger);font-size:14px;margin:0}

.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;white-space:nowrap;color:var(--mute)}
.tabs button.on{color:var(--ink);border-color:var(--bronze)}

// ---------- double authentification (TOTP) ----------
function mfaPanel(o){
  return new Promise(function(done){
    var m=$('mfa'),er=h('p',{class:'err',hidden:true}),btn=h('button',{class:'btn',type:'submit',text:o.button});
    var code=h('input',{type:'text',inputmode:'numeric',autocomplete:'one-time-code',maxlength:'6',pattern:'[0-9]{6}',placeholder:'Code à 6 chiffres',required:true,'aria-label':'Code à 6 chiffres'});
    var kids=[h('h1',{text:o.title,style:'font-size:26px;text-align:center'}),h('p',{text:o.intro,style:'margin:0;color:var(--mute)'})];
    if(o.extra)kids.push(o.extra);
    kids.push(code,er,btn);
    if(o.skip)kids.push(h('button',{class:'btn ghost',type:'button',text:'Plus tard',onclick:function(){m.hidden=true;done(true)}}));
    var f=h('form',{onsubmit:async function(e){
      e.preventDefault();btn.disabled=true;er.hidden=true;
      var r=await o.verify(code.value.trim());btn.disabled=false;
      if(r.error){er.textContent='Code incorrect ou expiré. Réessaie.';er.hidden=false;code.select();return}
      m.hidden=true;done(true);
    }},kids);
    $('login').hidden=true;m.textContent='';m.append(f);m.hidden=false;code.focus();
  });
}
async function mfaChallenge(){
  var l=await sb.auth.mfa.listFactors();
  var f=l.data&&l.data.totp&&l.data.totp[0];
  if(!f)return true;
  return mfaPanel({title:'Double authentification',intro:'Saisis le code à 6 chiffres de ton application d\'authentification.',button:'Valider',
    verify:function(c){return sb.auth.mfa.challengeAndVerify({factorId:f.id,code:c})}});
}
async function mfaEnroll(){
  var l=await sb.auth.mfa.listFactors();
  var old=((l.data&&l.data.all)||[]).filter(function(x){return x.status==='unverified'});
  for(var i=0;i<old.length;i++)await sb.auth.mfa.unenroll({factorId:old[i].id});
  var e=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'EL Admin '+Date.now()});
  if(e.error||!e.data||!e.data.totp)return true; // double authentification indisponible : on ne bloque pas
  var qr=String(e.data.totp.qr_code||'');
  var extra=h('div',{style:'display:grid;gap:8px;justify-items:center'},[
    /^data:image\//.test(qr)?h('img',{src:qr,alt:'QR code à scanner',width:'180',height:'180',style:'background:#fff;padding:8px'}):null,
    h('small',{text:'Ou saisis cette clé : '+e.data.totp.secret,style:'word-break:break-all;color:var(--mute);text-align:center'})]);
  return mfaPanel({title:'Sécuriser ton compte',intro:'Scanne ce QR code avec une application d\'authentification (Google Authenticator, Microsoft Authenticator, Authy…), puis saisis le code affiché.',
    extra:extra,button:'Activer',skip:true,
    verify:function(c){return sb.auth.mfa.challengeAndVerify({factorId:e.data.id,code:c})}});
}
async function mfaGate(){
  try{
    var a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(a.error||!a.data)return true;
    if(a.data.currentLevel==='aal2')return true;
    if(a.data.nextLevel==='aal2')return await mfaChallenge();
    return await mfaEnroll();
  }catch(e){return true}
}

async function start(){
  if(!(await mfaGate()))return;
